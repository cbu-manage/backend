name: Deploy Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: backend-deploy-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/cbu-manage/backend

jobs:
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build jar
        run: |
          chmod +x ./gradlew
          ./gradlew clean build --no-daemon

      - name: Image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push runtime image
        run: |
          docker build -f deploy/Dockerfile.runtime \
            -t "$IMAGE:${{ steps.meta.outputs.tag }}" \
            -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ steps.meta.outputs.tag }}"
          docker push "$IMAGE:latest"

  deploy:
    name: Deploy to server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Validate deployment secrets
        run: |
          test -n "${{ secrets.SERVER_IP }}" || (echo "Missing secret: SERVER_IP" && exit 1)
          test -n "${{ secrets.SERVER_USER }}" || (echo "Missing secret: SERVER_USER" && exit 1)
          test -n "${{ secrets.SERVER_SSH_KEY }}" || (echo "Missing secret: SERVER_SSH_KEY" && exit 1)

      - name: Checkout source for migrations
        uses: actions/checkout@v4

      - name: Copy migrations to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/sql/*.sql"
          target: ${{ secrets.SERVER_APP_DIR || '/home/ubuntu/cbu' }}/migrations-incoming
          strip_components: 2
          overwrite: true

      # 스키마를 먼저 맞추고 앱을 띄운다. 순서가 바뀌면 새 코드가 옛 스키마를 만난다.
      - name: Apply DB migrations
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.SERVER_APP_DIR || '/home/ubuntu/cbu' }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          envs: APP_DIR
          script: |
            set -e
            cd "$APP_DIR"

            # 접속 정보는 서버의 설정 파일에서 읽는다. 시크릿을 새로 만들지 않는다.
            CONF=config/application.properties
            DB_USER=$(grep -m1 '^spring.datasource.username=' "$CONF" | cut -d= -f2-)
            DB_PASS=$(grep -m1 '^spring.datasource.password=' "$CONF" | cut -d= -f2-)
            DB_NAME=$(grep -m1 '^spring.datasource.url=' "$CONF" | sed -E 's#.*/([A-Za-z0-9_]+)\?.*#\1#')

            run_sql() { docker exec -i mysql mysql -u "$DB_USER" -p"$DB_PASS" "$DB_NAME" "$@"; }

            run_sql -e "CREATE TABLE IF NOT EXISTS schema_migration (
              filename VARCHAR(255) NOT NULL PRIMARY KEY,
              applied_at DATETIME NOT NULL DEFAULT CURRENT_TIMESTAMP
            )"

            # 기록이 비어 있으면 첫 도입이다. 기존 파일은 이미 손으로 적용된 것으로 보고
            # 표시만 남긴다. 여기서 전부 실행하면 이미 반영된 DDL 이 다시 돌아 실패한다.
            APPLIED_COUNT=$(run_sql -N -e "SELECT COUNT(*) FROM schema_migration")
            if [ "$APPLIED_COUNT" = "0" ]; then
              echo "첫 도입: 기존 마이그레이션을 적용 완료로 표시만 합니다"
              for f in migrations-incoming/*.sql; do
                [ -e "$f" ] || continue
                run_sql -e "INSERT IGNORE INTO schema_migration (filename) VALUES ('$(basename "$f")')"
                echo "  baseline  $(basename "$f")"
              done
              exit 0
            fi

            for f in $(ls migrations-incoming/*.sql 2>/dev/null | sort); do
              name=$(basename "$f")
              DONE=$(run_sql -N -e "SELECT COUNT(*) FROM schema_migration WHERE filename='$name'")
              if [ "$DONE" != "0" ]; then
                echo "  건너뜀    $name"
                continue
              fi
              echo "  적용      $name"
              run_sql < "$f"
              run_sql -e "INSERT INTO schema_migration (filename) VALUES ('$name')"
            done
            echo "마이그레이션 완료"

      - name: Pull & restart on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.SERVER_APP_DIR || '/home/ubuntu/cbu' }}
          IMAGE_REF: ghcr.io/cbu-manage/backend:${{ needs.build.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          envs: APP_DIR,IMAGE_REF,GHCR_TOKEN,GHCR_USER
          script: |
            set -e
            cd "$APP_DIR"

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$IMAGE_REF"

            # 실패 시 되돌릴 직전 이미지. compose 기본값과 같은 값을 폴백으로 둔다.
            PREV=$(grep -m1 '^BACKEND_IMAGE=' .env 2>/dev/null | cut -d= -f2- || true)
            [ -n "$PREV" ] || PREV="cbu-backend:migr1"
            echo "previous image: $PREV"

            grep -v '^BACKEND_IMAGE=' .env 2>/dev/null > .env.tmp || true
            echo "BACKEND_IMAGE=$IMAGE_REF" >> .env.tmp
            mv .env.tmp .env

            docker compose up -d backend
            docker compose ps

            # 헬스체크: 백엔드가 응답할 때까지 최대 60초
            HEALTHY=0
            for i in $(seq 1 12); do
              if docker run --rm --network cbu-net curlimages/curl:8.10.1 \
                   -fs -o /dev/null http://backend:8080/api/v1/onboarding-links; then
                HEALTHY=1; echo "health OK"; break
              fi
              sleep 5
            done

            # 실패하면 직전 이미지로 되돌린다. 여기서 멈추면 dev 서버가 내려간 채로 남는다.
            if [ "$HEALTHY" != "1" ]; then
              echo "health check FAILED - rolling back to $PREV"
              docker logs backend --tail 50 || true
              sed -i "s#^BACKEND_IMAGE=.*#BACKEND_IMAGE=$PREV#" .env
              docker compose up -d backend
              docker logout ghcr.io || true
              exit 1
            fi

            docker logout ghcr.io

            # 옛 이미지 정리. 직전 이미지와 latest, 수동 롤백본(cbu-backend:migr1)은 남긴다.
            CUR_TAG="${IMAGE_REF##*:}"
            PREV_TAG="${PREV##*:}"
            docker images --filter "reference=ghcr.io/cbu-manage/backend" --format '{{.Repository}}:{{.Tag}}' \
              | grep -v ":${CUR_TAG}$" | grep -v ":${PREV_TAG}$" | grep -v ':latest$' \
              | xargs -r docker rmi || true
            docker image prune -f
